# App (personalizadas)
app:
  id: SFT01
  name: Challenge
  description: Challenge to SOOFT.
  version: 1.0.0
  debug: true

# Server
server:
  port: 8090

# Generic spring config
spring:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      format_sql: true
  datasource:
    url: jdbc:h2:file:./SFT_DB
    driverClassName: org.h2.Driver
    username: sftDev
    password: 123456
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json